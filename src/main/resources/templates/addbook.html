<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Booklist</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Books</h1>
        <form action="#" th:action="@{books}" th:object="${book}" method="post">
           <table>
            <tr>
                <td>Author: <input type="text" th:field="*{author}"/></td>
                <td>Title: <input type="text" th:field="*{title}"/></td>
                <td>ISBN: <input type="text" th:field="*{isbn}"/></td>
                <td>Year: <input type="text" th:field="*{publicationYear}"/></td>
                <td>Price: <input type="text" th:field="*{price}"/></td>
            </tr>
           </table> 
        <p><input type="submit" value="Add"/></p>
        </form>
</body>

</html>
